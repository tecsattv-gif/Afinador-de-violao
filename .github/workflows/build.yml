name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ler versão
        id: versao
        run: echo "nome=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Afinador-v${{ steps.versao.outputs.nome }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Afinador-v${{ steps.versao.outputs.nome }}
          path: Afinador-v${{ steps.versao.outputs.nome }}.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.nome }}
          name: Afinador v${{ steps.versao.outputs.nome }}
          files: Afinador-v${{ steps.versao.outputs.nome }}.apk
          make_latest: true
